<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>รายรับ-รายจ่าย</title>
    <meta name="description" content="บันทึกรายรับ-รายจ่าย วางแผนเดือน และดูว่าวันนี้ใช้ได้เท่าไหร่" />
    <meta name="theme-color" content="#f4f3f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121215" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="รายรับ-รายจ่าย" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a light flash in dark mode.
      try {
        var p = JSON.parse(localStorage.getItem('investor-rpg:prefs') || '{}')
        document.documentElement.dataset.theme = p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        if (p.lang) document.documentElement.lang = p.lang
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
